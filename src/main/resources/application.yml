spring:
  application:
    name: clube-volei

  # A aplicação liga-se com um papel SEM privilégios de dono nem BYPASSRLS.
  datasource:
    url: jdbc:postgresql://localhost:5432/clube
    username: clube_app
    password: clube_app

  # As migrações correm com o papel dono (distinto do da aplicação).
  flyway:
    url: jdbc:postgresql://localhost:5432/clube
    user: clube_owner
    password: clube_owner

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT HS256 para esta etapa. O valor por omissão é APENAS para desenvolvimento local.
# Em qualquer ambiente partilhado/produção, definir JWT_SECRET_BASE64 com um segredo
# aleatório de pelo menos 32 bytes, codificado em Base64.
app:
  security:
    # Em staging/producao, definir OIDC_ISSUER_URI (descoberta OIDC + JWKS publico).
    # Sem OIDC configurado, usa-se HS256 local (apenas desenvolvimento/testes).
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
    jwt:
      issuer: ${JWT_ISSUER:clube-volei-local}
      secret-base64: ${JWT_SECRET_BASE64:Y2x1YmUtdm9sZWktZGV2ZWxvcG1lbnQtc2VjcmV0LTIwMjY=}
