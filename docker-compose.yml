services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clube
      POSTGRES_USER: clube_owner      # dono do esquema (corre as migrações)
      POSTGRES_PASSWORD: clube_owner
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
