services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volei
      POSTGRES_USER: postgres          # superuser: só para o arranque; a aplicação nunca o usa
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria os papéis volei_migrator e volei_app na primeira inicialização
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web (http://localhost:8025)

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/volei
      SPRING_DATASOURCE_USERNAME: volei_app
      SPRING_DATASOURCE_PASSWORD: volei_app_password
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
